<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Smoke test player</title>
  <style>
    #movie_player {
      position: relative;
      width: 640px;
      height: 360px;
      background: #000;
    }
    #movie_player video {
      width: 100%;
      height: 100%;
    }
    .ytp-chrome-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px;
    }
    .ytp-progress-bar-container {
      position: relative;
      height: 5px;
    }
    .ytp-progress-bar {
      position: relative;
      height: 5px;
    }
    .ytp-progress-list {
      position: relative;
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
    }
    .ytp-play-progress {
      height: 6px;
      width: 40%;
      background-color: #f03;
    }
    .ytp-scrubber-container {
      position: absolute;
      top: -3px;
      left: 40%;
      width: 12px;
      height: 12px;
    }
    .ytp-scrubber-button {
      width: 12px;
      height: 12px;
      border-radius: 6px;
      background-color: #f03;
    }
    .ytp-chrome-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ytp-play-button {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
    }
    .ytp-play-button svg {
      width: 100%;
      height: 100%;
      fill: #fff;
    }
    .ytp-time-display {
      color: #eee;
      font: 12px Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="movie_player">
    <video></video>
    <div class="ytp-chrome-bottom">
      <div class="ytp-progress-bar-container">
        <div class="ytp-progress-bar" tabindex="0">
          <div class="ytp-progress-list">
            <div class="ytp-play-progress ytp-swatch-background-color"></div>
          </div>
          <div class="ytp-scrubber-container">
            <div class="ytp-scrubber-button ytp-swatch-background-color"></div>
          </div>
        </div>
      </div>
      <div class="ytp-chrome-controls">
        <button class="ytp-play-button ytp-button"><svg><path d="M0 0h10v10z"/></svg></button>
        <div class="ytp-time-display"><span class="ytp-time-current">0:00</span></div>
      </div>
    </div>
  </div>
</body>
</html>
