<svg width="920" height="680" viewBox="0 0 920 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12101f"/>
      <stop offset="55%" stop-color="#26224a"/>
      <stop offset="100%" stop-color="#161326"/>
    </linearGradient>
    <linearGradient id="videoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="680" fill="url(#bg)"/>
  <circle cx="40" cy="640" r="180" fill="#667eea" opacity="0.09"/>
  <circle cx="890" cy="20" r="150" fill="#ff0000" opacity="0.06"/>

  <!-- Title -->
  <text x="460" y="72" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">YouTube Overlay Opacity Controller</text>
  <rect x="415" y="90" width="90" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="460" y="126" font-family="Arial, sans-serif" font-size="17" fill="#b8b3d9" text-anchor="middle">Make YouTube's transparent player controls clearly visible</text>

  <!-- Player mockup -->
  <g transform="translate(120, 170)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="270" rx="12" fill="url(#videoBg)"/>
    <circle cx="380" cy="66" r="26" fill="#f1c40f" opacity="0.75"/>
    <path d="M 0 196 L 105 118 L 195 184 L 295 100 L 390 168 L 480 126 L 480 208 L 0 208 Z" fill="#1a252f" opacity="0.85"/>

    <!-- solid dark control bar -->
    <path d="M 0 208 L 480 208 L 480 258 Q 480 270 468 270 L 12 270 Q 0 270 0 258 Z" fill="#000" opacity="0.9"/>

    <!-- progress bar -->
    <rect x="16" y="214" width="448" height="4" rx="2" fill="#fff" opacity="0.3"/>
    <rect x="16" y="214" width="180" height="4" rx="2" fill="#ff0000"/>
    <circle cx="196" cy="216" r="7" fill="#ff0000"/>

    <!-- controls -->
    <path d="M 24 234 L 24 256 L 41 245 Z" fill="#fff"/>
    <path d="M 55 238 L 55 254 L 66 246 Z M 68 238 L 72 238 L 72 254 L 68 254 Z" fill="#fff"/>
    <path d="M 84 242 L 90 242 L 98 235 L 98 257 L 90 250 L 84 250 Z" fill="#fff"/>
    <text x="116" y="250" font-family="Arial, sans-serif" font-size="13" fill="#fff">3:32 / 10:24</text>
    <circle cx="416" cy="246" r="8" fill="none" stroke="#fff" stroke-width="2.5"/>
    <circle cx="416" cy="246" r="3" fill="#fff"/>
    <rect x="440" y="238" width="20" height="15" fill="none" stroke="#fff" stroke-width="2.5" rx="1"/>
  </g>

  <!-- Popup mockup -->
  <g transform="translate(640, 200)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="230" rx="14" fill="#ffffff"/>
    <text x="110" y="34" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">YouTube Overlay</text>
    <text x="110" y="52" font-family="Arial, sans-serif" font-size="10.5" fill="#777" text-anchor="middle">Background opacity</text>

    <!-- slider -->
    <rect x="26" y="84" width="168" height="8" rx="4" fill="#e4e4ee"/>
    <rect x="26" y="84" width="118" height="8" rx="4" fill="url(#accent)"/>
    <circle cx="144" cy="88" r="11" fill="#fff" stroke="#667eea" stroke-width="3"/>
    <text x="110" y="124" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#667eea" text-anchor="middle">70%</text>

    <!-- presets -->
    <rect x="26" y="142" width="80" height="30" rx="7" fill="#fff" stroke="#667eea" stroke-width="2"/>
    <text x="66" y="161" font-family="Arial, sans-serif" font-size="11" fill="#667eea" text-anchor="middle">Dark Gray</text>
    <rect x="114" y="142" width="80" height="30" rx="7" fill="#667eea"/>
    <text x="154" y="161" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">Solid Black</text>

    <!-- toggle -->
    <rect x="26" y="190" width="40" height="20" rx="10" fill="url(#accent)"/>
    <circle cx="56" cy="200" r="8" fill="#fff"/>
    <text x="76" y="204" font-family="Arial, sans-serif" font-size="10.5" fill="#444">Always show controls</text>
  </g>

  <!-- Features row -->
  <g transform="translate(120, 520)" font-family="Arial, sans-serif" font-size="18" fill="#d9d5f0">
    <circle cx="9" cy="-6" r="5" fill="#ff0000"/>
    <text x="26" y="0">0–100% opacity slider</text>

    <circle cx="269" cy="-6" r="5" fill="#ff0000"/>
    <text x="286" y="0">One-click presets</text>

    <circle cx="509" cy="-6" r="5" fill="#ff0000"/>
    <text x="526" y="0">Always-show controls</text>
  </g>
  <g transform="translate(120, 560)" font-family="Arial, sans-serif" font-size="18" fill="#d9d5f0">
    <circle cx="9" cy="-6" r="5" fill="#ff0000"/>
    <text x="26" y="0">Works on every video</text>

    <circle cx="269" cy="-6" r="5" fill="#ff0000"/>
    <text x="286" y="0">Settings sync</text>

    <circle cx="509" cy="-6" r="5" fill="#ff0000"/>
    <text x="526" y="0">No data collection</text>
  </g>

  <!-- Bottom tagline -->
  <text x="460" y="636" font-family="Arial, sans-serif" font-size="17" fill="#8d88b0" text-anchor="middle">
    Free • Open source • Privacy friendly
  </text>
</svg>
