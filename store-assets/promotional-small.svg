<svg width="440" height="280" viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12101f"/>
      <stop offset="55%" stop-color="#26224a"/>
      <stop offset="100%" stop-color="#161326"/>
    </linearGradient>
    <linearGradient id="videoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="url(#bg)"/>
  <circle cx="30" cy="270" r="110" fill="#667eea" opacity="0.10"/>
  <circle cx="420" cy="10" r="90" fill="#ff0000" opacity="0.07"/>

  <!-- Player mockup -->
  <g transform="translate(60, 34)" filter="url(#shadow)">
    <!-- video area -->
    <rect x="0" y="0" width="320" height="180" rx="10" fill="url(#videoBg)"/>
    <!-- fake scenery -->
    <circle cx="255" cy="46" r="18" fill="#f1c40f" opacity="0.75"/>
    <path d="M 0 130 L 70 78 L 130 122 L 200 66 L 260 112 L 320 84 L 320 170 L 0 170 Z" fill="#1a252f" opacity="0.85"/>

    <!-- solid dark control bar (the extension's effect) -->
    <path d="M 0 138 L 320 138 L 320 170 Q 320 180 310 180 L 10 180 Q 0 180 0 170 Z" fill="#000" opacity="0.88"/>

    <!-- progress bar -->
    <rect x="12" y="141" width="296" height="3" rx="1.5" fill="#ffffff" opacity="0.25"/>
    <rect x="12" y="141" width="120" height="3" rx="1.5" fill="#ff0000"/>
    <circle cx="132" cy="142.5" r="5" fill="#ff0000"/>

    <!-- controls: play, next, volume -->
    <path d="M 18 154 L 18 172 L 32 163 Z" fill="#fff"/>
    <path d="M 42 156 L 42 170 L 52 163 Z M 53 156 L 56 156 L 56 170 L 53 170 Z" fill="#fff"/>
    <path d="M 66 160 L 71 160 L 78 154 L 78 172 L 71 166 L 66 166 Z" fill="#fff"/>
    <path d="M 82 158 Q 87 163 82 168" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="96" y="167" font-family="Arial, sans-serif" font-size="10" fill="#fff">3:32 / 10:24</text>

    <!-- right controls: settings + fullscreen -->
    <circle cx="272" cy="163" r="6" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="272" cy="163" r="2" fill="#fff"/>
    <rect x="292" y="157" width="16" height="12" fill="none" stroke="#fff" stroke-width="2" rx="1"/>
  </g>

  <!-- Title -->
  <text x="220" y="248" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">
    YouTube Overlay Opacity
  </text>
  <text x="220" y="268" font-family="Arial, sans-serif" font-size="12.5" fill="#b8b3d9" text-anchor="middle">
    Solid, readable player controls — your way
  </text>
</svg>
