<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12101f"/>
      <stop offset="55%" stop-color="#26224a"/>
      <stop offset="100%" stop-color="#161326"/>
    </linearGradient>
    <linearGradient id="videoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="560" fill="url(#bg)"/>
  <circle cx="80" cy="520" r="220" fill="#667eea" opacity="0.09"/>
  <circle cx="1350" cy="30" r="180" fill="#ff0000" opacity="0.06"/>

  <!-- BEFORE player -->
  <g transform="translate(80, 130)" filter="url(#shadow)">
    <text x="190" y="-24" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#8d88b0" text-anchor="middle" letter-spacing="2">BEFORE</text>
    <rect x="0" y="0" width="380" height="214" rx="10" fill="url(#videoBg)"/>
    <circle cx="300" cy="56" r="22" fill="#f1c40f" opacity="0.75"/>
    <path d="M 0 156 L 85 94 L 155 146 L 235 80 L 310 134 L 380 100 L 380 204 L 0 204 Z" fill="#1a252f" opacity="0.85"/>

    <!-- barely visible transparent controls -->
    <rect x="14" y="170" width="352" height="3" rx="1.5" fill="#fff" opacity="0.12"/>
    <rect x="14" y="170" width="140" height="3" rx="1.5" fill="#ff0000" opacity="0.3"/>
    <path d="M 20 182 L 20 200 L 34 191 Z" fill="#fff" opacity="0.25"/>
    <path d="M 46 186 L 51 186 L 58 180 L 58 198 L 51 192 L 46 192 Z" fill="#fff" opacity="0.25"/>
    <text x="74" y="195" font-family="Arial, sans-serif" font-size="11" fill="#fff" opacity="0.25">3:32 / 10:24</text>
    <circle cx="330" cy="190" r="7" fill="none" stroke="#fff" stroke-width="2" opacity="0.25"/>
    <rect x="350" y="184" width="16" height="12" fill="none" stroke="#fff" stroke-width="2" rx="1" opacity="0.25"/>
  </g>

  <!-- Arrow -->
  <g transform="translate(495, 237)" opacity="0.85">
    <path d="M 0 0 L 55 0 M 55 0 L 43 -11 M 55 0 L 43 11" stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- AFTER player -->
  <g transform="translate(580, 130)" filter="url(#shadow)">
    <text x="190" y="-24" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">AFTER</text>
    <rect x="0" y="0" width="380" height="214" rx="10" fill="url(#videoBg)"/>
    <circle cx="300" cy="56" r="22" fill="#f1c40f" opacity="0.75"/>
    <path d="M 0 156 L 85 94 L 155 146 L 235 80 L 310 134 L 380 100 L 380 160 L 0 160 Z" fill="#1a252f" opacity="0.85"/>

    <!-- solid dark control bar -->
    <path d="M 0 160 L 380 160 L 380 204 Q 380 214 370 214 L 10 214 Q 0 214 0 204 Z" fill="#000" opacity="0.9"/>

    <!-- clear controls -->
    <rect x="14" y="166" width="352" height="3" rx="1.5" fill="#fff" opacity="0.3"/>
    <rect x="14" y="166" width="140" height="3" rx="1.5" fill="#ff0000"/>
    <circle cx="154" cy="167.5" r="6" fill="#ff0000"/>
    <path d="M 20 182 L 20 200 L 34 191 Z" fill="#fff"/>
    <path d="M 46 186 L 51 186 L 58 180 L 58 198 L 51 192 L 46 192 Z" fill="#fff"/>
    <text x="74" y="195" font-family="Arial, sans-serif" font-size="11" fill="#fff">3:32 / 10:24</text>
    <circle cx="330" cy="190" r="7" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="330" cy="190" r="2.5" fill="#fff"/>
    <rect x="350" y="184" width="16" height="12" fill="none" stroke="#fff" stroke-width="2" rx="1"/>
  </g>

  <!-- Right column: title + features -->
  <g transform="translate(1030, 150)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff">YouTube Overlay</text>
    <text x="0" y="46" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff">Opacity Controller</text>

    <rect x="0" y="76" width="90" height="5" rx="2.5" fill="url(#accent)"/>

    <g transform="translate(0, 118)" font-family="Arial, sans-serif" font-size="19" fill="#d9d5f0">
      <circle cx="9" cy="-6" r="5" fill="#ff0000"/>
      <text x="28" y="0">0–100% opacity slider</text>

      <circle cx="9" cy="34" r="5" fill="#ff0000"/>
      <text x="28" y="40">One-click presets</text>

      <circle cx="9" cy="74" r="5" fill="#ff0000"/>
      <text x="28" y="80">Always-show controls</text>

      <circle cx="9" cy="114" r="5" fill="#ff0000"/>
      <text x="28" y="120">Settings sync across devices</text>
    </g>
  </g>

  <!-- Bottom tagline -->
  <text x="700" y="512" font-family="Arial, sans-serif" font-size="21" fill="#b8b3d9" text-anchor="middle">
    Stop squinting at transparent controls — make them clearly visible in one click
  </text>
</svg>
