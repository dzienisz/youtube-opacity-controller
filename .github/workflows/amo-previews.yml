name: AMO listing screenshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose how to handle existing AMO previews
        required: true
        default: new
        type: choice
        options:
          - new
          - resume
          - replace

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify AMO credentials
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER and AMO_JWT_SECRET secrets are required to upload listing screenshots"
            exit 1
          fi

      - name: Upload AMO listing screenshots
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/amo-previews.mjs ${{ inputs.mode == 'resume' && '--resume' || inputs.mode == 'replace' && '--replace' || '' }}
